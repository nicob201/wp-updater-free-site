name: release-check

# A failed scheduled run emails the repo owner: the demo is showing an older version of the tool
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The demo shows the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/nicob201/wp-updater-free/releases/latest --jq .tag_name)
          current=$(cat demo/version.txt)
          if [ "$latest" != "$current" ]; then
            echo "::error::WP Updater $latest is out and the demo shows $current. Run node scripts/sync-demo.js and check the demo."
            exit 1
          fi
          echo "The demo shows $current, the latest release."
